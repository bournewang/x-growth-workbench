<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XGrowth · 运营后台</title><link rel="stylesheet" href="/admin/style.css"></head><body>
<section id="login" class="login"><div class="login-card"><span class="eyebrow">XGROWTH / ADMIN</span><h1>欢迎回来。</h1><p>管理授权，了解产品的每一天。</p><form id="login-form"><label>管理密码<input id="password" type="password" autocomplete="current-password" required></label><button>登录后台 →</button><p id="login-error" role="alert"></p></form><small>仅管理员可访问 · 登录有效期 8 小时</small></div></section>
<div id="app" hidden><aside><a class="brand" href="/admin/">↗ <strong>XGrowth</strong><span>运营后台</span></a><div class="nav-label">工作空间</div><nav><button data-view="overview" class="active">◫　运营概览</button><button data-view="installations">◎　用户与使用</button><button data-view="licenses">◇　授权管理</button><button data-view="orders">▤　订单记录</button><button data-view="audit">↺　操作日志</button></nav><div class="aside-bottom"><span class="live-dot"></span> 授权服务连接中<button id="logout">退出登录 ↗</button></div></aside>
<main><header><div><span class="eyebrow">YOUR GROWTH, IN VIEW</span><h1 id="view-title">运营概览</h1></div><div class="header-actions"><select id="range" aria-label="趋势天数"><option value="7">近 7 天</option><option value="30">近 30 天</option></select><button class="secondary" id="refresh">刷新 ↻</button></div></header><p id="notice" role="status"></p><div id="content"></div></main></div>
<dialog id="modal"><div class="dialog-head"><h2 id="modal-title"></h2><button id="close-modal" class="secondary" aria-label="关闭">×</button></div><form id="action-form"></form><p id="modal-error" role="alert"></p></dialog>
<script src="/admin/app.js" defer></script></body></html>
